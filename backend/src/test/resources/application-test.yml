app:
  auth:
    mock-enabled: true
    resend-cooldown: 1s
    max-challenges-per-phone-per-hour: 100
    max-challenges-per-phone-per-day: 1000
    phone-hash-secret: test-phone-hash-secret-0123456789abcdef
    max-challenges-per-ip-per-hour: 10000
  media:
    url-signing-secret: test-photo-url-signing-secret-0123456789
  cors:
    allowed-origins: http://localhost:3000
  economy:
    premium-features: [TEST_PREMIUM_FEATURE, ADVANCED_FILTERS, EXCLUSION_WORDS, UNDO_SWIPE, PASS_REFRESH, INVISIBLE, DATE_PLAN]
    premium-allowances:
      - item-code: TEST_SUPERLIKE
        quantity: 5
        period: WEEKLY
        mode: TOP_UP
      - item-code: TEST_TICKET
        quantity: 1
        period: WEEKLY
        mode: ADD
  music:
    musicbrainz-enabled: false
  places:
    enabled: false
  gacha:
    enabled: true
  verification-gate:
    enabled: false # on in VerificationGateIntegrationTest; other tests use unverified users
  testing:
    enabled: true
    test-phones: >-
      +78000000001, +78000000002, +78000000003, +78000000004, +78000000005,
      +78000000006, +78000000007, +78000000008, +78000000009
    otp-code: "654321"
  admin:
    bootstrap-phones: +7 801 000-00-01
