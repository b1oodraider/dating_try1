# Base configuration shared by all profiles.
# There is intentionally NO default profile: run with SPRING_PROFILES_ACTIVE=dev locally
# and SPRING_PROFILES_ACTIVE=prod in Docker. The datasource comes from SPRING_DATASOURCE_* env vars.
server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: dating-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Liquibase
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  auth:
    mock-enabled: false
    otp-ttl: 5m
    max-attempts: 5
    session-ttl: 30d
    resend-cooldown: 60s
    max-challenges-per-phone-per-hour: 5
    max-challenges-per-ip-per-hour: 30
  media:
    storage-path: ${APP_MEDIA_STORAGE_PATH:./data/media}
    max-file-size: 5MB
    max-photos-per-profile: 6
    # Required, >= 32 chars. Signs photo URLs; rotating it invalidates all issued photo links.
    url-signing-secret: ${APP_MEDIA_URL_SIGNING_SECRET:}
    url-ttl: 1h
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
