# Base configuration shared by all profiles.
# There is intentionally NO default profile: run with SPRING_PROFILES_ACTIVE=dev locally
# and SPRING_PROFILES_ACTIVE=prod in Docker. The datasource comes from SPRING_DATASOURCE_* env vars.
server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: dating-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    hikari:
      # Each PostgreSQL connection loads the Hunspell dictionary once (~26 MB), keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Liquibase
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  auth:
    mock-enabled: false
    otp-ttl: 5m
    max-attempts: 5
    session-ttl: 30d
    resend-cooldown: 60s
    max-challenges-per-phone-per-hour: 5
    max-challenges-per-ip-per-hour: 30
  media:
    storage-path: ${APP_MEDIA_STORAGE_PATH:./data/media}
    max-file-size: 5MB
    max-photos-per-profile: 6
    # Required, >= 32 chars. Signs photo URLs; rotating it invalidates all issued photo links.
    url-signing-secret: ${APP_MEDIA_URL_SIGNING_SECRET:}
    url-ttl: 1h
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  economy:
    # Feature codes reserved for premium (checked via FeatureAccess.require). Empty until decided.
    # ADVANCED_FILTERS: search by height/goals + excluded goals; EXCLUSION_WORDS: saved exclusion words.
    # Remove a code to make the feature free. The premium badge is shown for any active premium.
    premium-features: [ADVANCED_FILTERS, EXCLUSION_WORDS]
    # Consumables granted to premium users every period (into the PERIODIC bucket, spent first).
    #   period: DAILY | WEEKLY | MONTHLY (UTC calendar)
    #   mode:   TOP_UP refills up to quantity (unused units do not pile up); ADD adds quantity every period
    # STUB values for testing until the premium content is decided (premium cannot be bought yet).
    premium-allowances:
      - item-code: SUPERLIKE
        quantity: 5
        period: WEEKLY
        mode: TOP_UP
      - item-code: GACHA_TICKET
        quantity: 1
        period: WEEKLY
        mode: ADD
  testing:
    # Test accounts: phones below become test accounts (isolated from real users in discovery).
    # enabled=true additionally exposes /api/v1/testing and a fixed OTP code (no SMS) for these phones.
    enabled: ${APP_TESTING_ENABLED:false}
    test-phones: ${APP_TESTING_TEST_PHONES:}
    otp-code: ${APP_TESTING_OTP_CODE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
