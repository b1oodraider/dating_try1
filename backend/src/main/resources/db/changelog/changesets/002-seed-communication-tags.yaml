              - column: { name: description, value: "Без неожиданных звонков и голосовых сообщений" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 20 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "CALLS_VOICE_WELCOME" }
              - column: { name: category, value: "calls" }
              - column: { name: category_label, value: "Звонки и сообщения" }
              - column: { name: label, value: "Голосовые ок" }
              - column: { name: description, value: "Удобно слушать и отправлять аудиосообщения" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 21 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "CALLS_PRE_CALL_CHECK" }
              - column: { name: category, value: "calls" }
              - column: { name: category_label, value: "Звонки и сообщения" }
              - column: { name: label, value: "Звонок по согласованию" }
              - column: { name: description, value: "Не против созвониться, если заранее договорились о времени" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 22 }

        # Boundaries & Topics
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "BOUND_NO_SMALLTALK" }
              - column: { name: category, value: "boundaries" }
              - column: { name: category_label, value: "Комфорт и темы" }
              - column: { name: label, value: "Сразу к интересным темам" }
              - column: { name: description, value: "Меньше протокольных «как дела», больше разговоров о том, что вдохновляет" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 30 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "BOUND_RESPECT_LIMITS" }
              - column: { name: category, value: "boundaries" }
              - column: { name: category_label, value: "Комфорт и темы" }
              - column: { name: label, value: "Без настойчивости" }
              - column: { name: description, value: "Ценю, когда уважают ответ «нет» или просьбу сменить тему" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 31 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "BOUND_DIRECT_COMMUNICATION" }
              - column: { name: category, value: "boundaries" }
              - column: { name: category_label, value: "Комфорт и темы" }
              - column: { name: label, value: "Прямота без намеков" }
              - column: { name: description, value: "Предпочитаю ясные слова догадкам и полунамекам" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 32 }

        # Social
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "SOC_QUIET_SPACES" }
              - column: { name: category, value: "social" }
              - column: { name: category_label, value: "Социальная среда" }
              - column: { name: label, value: "Тихие места" }
              - column: { name: description, value: "Быстро утомляюсь в шумных толпах и клубах, выбираю уютные пространства" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 40 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "SOC_DEEP_TALKS" }
              - column: { name: category, value: "social" }
              - column: { name: category_label, value: "Социальная среда" }
              - column: { name: label, value: "Глубокие разговоры" }
              - column: { name: description, value: "Интереснее обсудить идеи, книги, взгляды на мир, чем светскую суету" }
