databaseChangeLog:
  - changeSet:
      id: 002-seed-communication-tags
      author: dating-team
      changes:
        # Pace
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "PACE_ASYNCHRONOUS" }
              - column: { name: category, value: "pace" }
              - column: { name: category_label, value: "Темп переписки" }
              - column: { name: label, value: "Асинхронный ответ" }
              - column: { name: description, value: "Отвечаю в течение дня без спешки и не жду мгновенных ответов" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 1 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "PACE_FAST_CHAT" }
              - column: { name: category, value: "pace" }
              - column: { name: category_label, value: "Темп переписки" }
              - column: { name: label, value: "Люблю живой диалог" }
              - column: { name: description, value: "Когда свободен(-на), переписываюсь в моменте" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 2 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "PACE_LOW_BATTERY" }
              - column: { name: category, value: "pace" }
              - column: { name: category_label, value: "Темп переписки" }
              - column: { name: label, value: "Иногда беру паузу" }
              - column: { name: description, value: "Могу на пару дней уйти в офлайн, это не значит потерю интереса" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 3 }

        # Format
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "FORMAT_WALK_FIRST" }
              - column: { name: category, value: "format" }
              - column: { name: category_label, value: "Формат первой встречи" }
              - column: { name: label, value: "Прогулка на воздухе" }
              - column: { name: description, value: "Спокойная прогулка по парку или городу без шума заведений" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 10 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "FORMAT_COFFEE_SHORT" }
              - column: { name: category, value: "format" }
              - column: { name: category_label, value: "Формат первой встречи" }
              - column: { name: label, value: "Кофе на 30–40 минут" }
              - column: { name: description, value: "Короткая встреча без давления, чтобы познакомиться вживую" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 11 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "FORMAT_TEXT_BEFORE_MEET" }
              - column: { name: category, value: "format" }
              - column: { name: category_label, value: "Формат первой встречи" }
              - column: { name: label, value: "Сначала переписка" }
              - column: { name: description, value: "Предпочитаю пообщаться несколько дней перед первой встречей" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 12 }
        - insert:
            tableName: communication_tags
            columns:
              - column: { name: id, valueComputed: "gen_random_uuid()" }
              - column: { name: code, value: "FORMAT_SHARED_ACTIVITY" }
              - column: { name: category, value: "format" }
              - column: { name: category_label, value: "Формат первой встречи" }
              - column: { name: label, value: "Совместное занятие" }
              - column: { name: description, value: "Выставка, настолки или музей вместо сидения друг напротив друга" }
              - column: { name: active, valueBoolean: true }
              - column: { name: sort_order, valueNumeric: 13 }

