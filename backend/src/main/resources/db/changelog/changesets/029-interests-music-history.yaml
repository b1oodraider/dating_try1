databaseChangeLog:
  # docs/matching.md, part 1: interests (closed dictionary in categories, up to 10 per profile) and music
  # (own artist dictionary, topped up from MusicBrainz, up to 5). The zodiac sign is shown only when the owner wants.
  # profile_history keeps the previous state of the profile on every change (moderation and support history).
  - changeSet:
      id: 029-interests-music-history
      author: dating-team
      changes:
        - sql:
            sql: >
              CREATE TABLE interest_categories (
                code       VARCHAR(40) PRIMARY KEY,
                label      VARCHAR(60) NOT NULL,
                sort_order INT NOT NULL
              )
        - sql:
            sql: >
              CREATE TABLE interests (
                code          VARCHAR(40) PRIMARY KEY,
                label         VARCHAR(60) NOT NULL,
                category_code VARCHAR(40) NOT NULL REFERENCES interest_categories (code),
                sort_order    INT NOT NULL,
                active        BOOLEAN NOT NULL DEFAULT TRUE
              )
        - sql:
            sql: >
              CREATE TABLE profile_interests (
                profile_id    UUID NOT NULL REFERENCES profiles (id) ON DELETE CASCADE,
                interest_code VARCHAR(40) NOT NULL REFERENCES interests (code),
                PRIMARY KEY (profile_id, interest_code)
              )
        - sql:
            sql: >
              CREATE TABLE artists (
                id              BIGSERIAL PRIMARY KEY,
                name            VARCHAR(200) NOT NULL,
                name_normalized VARCHAR(200) NOT NULL UNIQUE,
                mbid            UUID UNIQUE,
                source          VARCHAR(20) NOT NULL DEFAULT 'SEED',
                created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now()
              )
        - sql:
            sql: CREATE INDEX idx_artists_name_trgm ON artists USING gin (name_normalized gin_trgm_ops)
        - sql:
            sql: >
              CREATE TABLE profile_artists (
                profile_id UUID NOT NULL REFERENCES profiles (id) ON DELETE CASCADE,
                artist_id  BIGINT NOT NULL REFERENCES artists (id),
                PRIMARY KEY (profile_id, artist_id)
              )
        - sql:
            sql: ALTER TABLE profiles ADD COLUMN show_zodiac BOOLEAN NOT NULL DEFAULT FALSE
        - sql:
            sql: >
              CREATE TABLE profile_history (
                id         BIGSERIAL PRIMARY KEY,
                profile_id UUID NOT NULL REFERENCES profiles (id) ON DELETE CASCADE,
                changed_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                snapshot   JSONB NOT NULL
              )
        - sql:
            sql: CREATE INDEX idx_profile_history_profile ON profile_history (profile_id, changed_at)
