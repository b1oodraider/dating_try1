databaseChangeLog:
  # Interest groups (docs/communities.md): a community around a film, book, series, game or franchise. People subscribe
  # and can search the feed among members of the groups they pick. Groups are created by staff; users suggest new ones.
  - changeSet:
      id: 040-communities
      author: dating-team
      changes:
        - sql:
            sql: >
              CREATE TABLE communities (
                id          BIGSERIAL PRIMARY KEY,
                slug        VARCHAR(60) NOT NULL UNIQUE,
                title       VARCHAR(80) NOT NULL,
                kind        VARCHAR(20) NOT NULL
                            CHECK (kind IN ('FILM', 'SERIES', 'BOOK', 'GAME', 'ANIME', 'MUSIC', 'FRANCHISE', 'OTHER')),
                emoji       VARCHAR(16),
                description VARCHAR(500),
                sort_order  INT NOT NULL DEFAULT 0,
                active      BOOLEAN NOT NULL DEFAULT TRUE,
                created_at  TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                updated_at  TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now()
              )
        - sql:
            sql: CREATE INDEX idx_communities_title_trgm ON communities USING gin (lower(title) gin_trgm_ops)
        - sql:
            sql: >
              CREATE TABLE community_members (
                account_id   UUID NOT NULL,
                community_id BIGINT NOT NULL REFERENCES communities (id) ON DELETE CASCADE,
                joined_at    TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                PRIMARY KEY (account_id, community_id)
              )
        - sql:
            sql: CREATE INDEX idx_community_members_community ON community_members (community_id)
        - sql:
            sql: >
              CREATE TABLE community_suggestions (
                id         UUID PRIMARY KEY,
                account_id UUID NOT NULL,
                title      VARCHAR(80) NOT NULL,
                comment    VARCHAR(300),
                status     VARCHAR(10) NOT NULL DEFAULT 'NEW' CHECK (status IN ('NEW', 'ACCEPTED', 'REJECTED')),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                decided_at TIMESTAMP WITH TIME ZONE
              )
        - sql:
            sql: CREATE INDEX idx_community_suggestions_status ON community_suggestions (status, created_at)
