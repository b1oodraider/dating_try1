openapi: 3.1.0
info:
  title: Dating API
  version: 1.2.0
  description: |
    REST API закрытого MVP сервиса комфортных знакомств (модульный монолит).
    Краткая человекочитаемая версия контракта — docs/api-contract.md.
    Все ошибки имеют формат Error; заголовок X-Trace-Id есть в каждом ответе.

servers:
  - url: /api/v1
    description: Основной сервер API v1

security:
  - bearerAuth: []

tags:
  - name: admin
    description: Staff API (/admin/**). Роли проверяются по БД на каждый запрос; нет роли — 403 ROLE_REQUIRED (details.roles).
  - name: testing
    description: Testing API. Есть только при app.testing.enabled=true; только тестовые аккаунты (иначе 403 TEST_ACCOUNT_REQUIRED).

paths:
  /auth/otp/request:
    post:
      summary: Запрос одноразового кода
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  maxLength: 32
                  description: Любое написание номера ("+7 (999) 123-45-67", "89991234567"), сервер нормализует.
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      summary: Подтверждение кода и выдача сессии
      description: Номер телефона берётся из challenge; клиент его не передаёт.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          description: INVALID_CHALLENGE | CHALLENGE_ALREADY_USED | CHALLENGE_EXPIRED | MAX_ATTEMPTS_EXCEEDED | INVALID_CODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: ACCOUNT_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: Отзыв текущей сессии
      responses:
        '204': { description: Сессия отозвана }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      summary: Текущий аккаунт
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Удаление аккаунта
      description: Удаляет анкету, фото и все сессии; телефон отвязывается и может быть зарегистрирован заново.
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile:
    get:
      summary: Собственная анкета (создаётся пустой при первом обращении)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Частичное обновление анкеты (null/отсутствие поля = без изменений)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          description: VALIDATION_ERROR | UNKNOWN_TAG | UNKNOWN_GOAL (fieldErrors)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile/publish:
    post:
      summary: Публикация анкеты
      description: Требует имя, возраст, город и хотя бы одно фото.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400':
          description: PROFILE_INCOMPLETE, fieldErrors перечисляет недостающие поля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile/hide:
    post:
      summary: Скрытие анкеты
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile/photos:
    get:
      summary: Мои фотографии
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Загрузка фото
      description: |
        JPEG/PNG/WebP определяются по содержимому файла, до 5 МБ, максимум 6 фото.
        EXIF/XMP и текстовые метаданные удаляются (ориентация JPEG сохраняется).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Фото сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /me/profile/photos/{photoId}:
    parameters:
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Сделать фото главным
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить фото
      description: Если удалено последнее фото опубликованной анкеты, она возвращается в DRAFT.
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }

  /media/photos/{photoId}:
    get:
      summary: Изображение по подписанной ссылке
      description: Публичный адрес, авторизация — HMAC-подпись в ссылке (работает в <img src>). Ссылку выдаёт API в поле Photo.url.
      security: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: exp, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Изображение
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404': { $ref: '#/components/responses/Error' }

  /discovery/profiles:
    get:
      summary: Лента анкет
      description: Только для авторизованных. Только опубликованные анкеты активных аккаунтов, без собственной. Все фильтры применяются в БД до пагинации.
      parameters:
        - { name: city, in: query, schema: { type: string }, description: Без учёта регистра; ALL или пусто — любой город }
        - { name: minAge, in: query, schema: { type: integer } }
        - { name: maxAge, in: query, schema: { type: integer } }
        - { name: tagCodes, in: query, schema: { type: string }, description: Коды карточек через запятую (до 10) }
        - { name: tagLogic, in: query, schema: { type: string, enum: [AND, OR], default: OR } }
        - { name: minHeight, in: query, schema: { type: integer }, description: 'Премиум ADVANCED_FILTERS; анкеты без роста не подходят' }
        - { name: maxHeight, in: query, schema: { type: integer }, description: Премиум ADVANCED_FILTERS }
        - { name: goalCodes, in: query, schema: { type: string }, description: 'Премиум ADVANCED_FILTERS; коды целей через запятую, достаточно одной' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Страница анкет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumRequired' }

  /me/exclusion-words:
    get:
      summary: Мои слова-исключения
      description: Приватный список; анкеты, где в «о себе» или активном статусе дня встречается любое из слов (в любой словоформе), скрываются из моей ленты.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExclusionWords' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Заменить список слов-исключений
      description: Сервер обрезает пробелы, приводит к нижнему регистру и убирает дубликаты. Пустой список отключает фильтр.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [words]
              properties:
                words:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 2, maxLength: 30, pattern: '^[\p{L}\p{N}]+$' }
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExclusionWords' }
        '400':
          description: VALIDATION_ERROR (fieldErrors.words)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumRequired' }

  /tags:
    get:
      summary: Справочник карточек общения
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }

  /goals:
    get:
      summary: Справочник целей знакомства
      security: []
      responses:
        '200':
          description: Активные цели по sortOrder
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Goal' }

  /me/excluded-goals:
    get:
      summary: Сохранённые исключённые цели (жёсткий фильтр ленты)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcludedGoals' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Заменить исключённые цели
      description: Премиум ADVANCED_FILTERS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalCodes]
              properties:
                goalCodes: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcludedGoals' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumRequired' }

  /me/wallet:
    get:
      summary: Кошелёк (премиум, расходники, косметика)
      description: Открытие кошелька также идемпотентно начисляет положенные премиум-выдачи за период.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/cosmetics/equipped/{slot}:
    parameters:
      - { name: slot, in: path, required: true, schema: { type: string, enum: [PHOTO_FRAME, PROFILE_STATUS, CHAT_WALLPAPER] } }
    put:
      summary: Надеть косметику в слот
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemCode]
              properties:
                itemCode: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { description: 'UNKNOWN_SLOT | WRONG_SLOT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'ITEM_NOT_OWNED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Снять косметику со слота
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/achievements:
    get:
      summary: Мои достижения
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Achievement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog:
    get:
      summary: Активные предметы каталога
      description: Лимитированные предметы выводятся и вне окна; availableNow считается по экономическому времени вызывающего. Порядок — kind, category, code.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [CONSUMABLE, COSMETIC] } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
        '400': { description: 'VALIDATION_ERROR (неизвестный kind)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/images/{imageId}:
    get:
      summary: Картинка предмета каталога
      description: Публичная, неизменяемая по id (Cache-Control public, max-age 1 год, immutable). Ссылку содержит attributes.imageUrl.
      security: []
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Изображение
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404': { description: 'IMAGE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /discovery/views:
    post:
      summary: Сколько времени смотрели анкеты (для правила спам-лайков)
      description: |
        Пачками, когда карточка уходит с экрана или закрываются подробности. Никому не показывается, хранится 90 дней,
        удаляется вместе с аккаунтом. Неизвестные и свои анкеты пропускаются.
        Правило спам-лайков: за последние 10 реакций (не старше 10 мин) ≥ 90 % лайков И (медианная пауза < 3 с ИЛИ,
        если просмотры пришли для большинства лайков, ≥ 80 % лайков после < 1 с на экране без открытия подробностей) →
        ограничение LIKES (LIKE_SPAM) на 1 ч, удваивается при повторах в течение 30 дней до 7 дней; лайки этого окна
        удаляются (пропадают из «вас лайкнули»), лайки за существующими мэтчами остаются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [views]
              properties:
                views:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [profileId, dwellMs]
                    properties:
                      profileId: { type: string, format: uuid }
                      dwellMs: { type: integer, minimum: 0, maximum: 3600000, description: Время на экране (карточка и подробности) }
                      openedDetails: { type: boolean, default: false }
      responses:
        '204': { description: Сохранено }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /discovery/profiles/{profileId}/like:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
    post:
      summary: Лайк анкеты из ленты
      description: |
        Повтор идемпотентен (matched false); лайк после суперлайка ничего не меняет; уже сматченная пара — matched true + matchId.
        Мэтч создаёт только новый лайк при встречном лайке. Цели — событие like_received, при мэтче обоим — match.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionResult' }
        '400': { description: 'SELF_ACTION', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'ACCOUNT_RESTRICTED (details.kind = LIKES, details.until)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'PROFILE_NOT_FOUND (нет, не опубликована, другой тип аккаунта, блокировка)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /discovery/profiles/{profileId}/superlike:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
    post:
      summary: Суперлайк (тратит 1 SUPERLIKE)
      description: Повтор с тем же idempotencyKey или повторный суперлайк той же анкеты не списывает повторно.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdempotencyKeyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionResult' }
        '400': { description: 'VALIDATION_ERROR | SELF_ACTION', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'ACCOUNT_RESTRICTED (details.kind = LIKES, details.until)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'PROFILE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/InsufficientBalance' }

  /discovery/profiles/{profileId}/pass:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
    post:
      summary: Пропустить анкету
      description: Скрывает анкету из ленты на app.social.pass-ttl (30 дней). Всегда matched false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionResult' }
        '400': { description: 'SELF_ACTION', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'PROFILE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'ALREADY_LIKED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/likes/received:
    get:
      summary: Кто меня лайкнул
      description: Неотвеченные лайки (без встречного лайка, активного пропуска, блокировки); сначала суперлайки, затем новые. Премиум WHO_LIKED_ME, если функция есть в Wallet.premiumFeatures.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 }, description: '< 0 → 0' }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 }, description: '<= 0 → 20, больше 50 → 50' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedLikesPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumRequired' }

  /me/likes/received/count:
    get:
      summary: Количество неотвеченных лайков (без премиума)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, format: int64 }
                  superlikeCount: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accounts/{profileId}/block:
    parameters:
      - { $ref: '#/components/parameters/ProfileId' }
    post:
      summary: Заблокировать человека (в пути — id анкеты)
      description: Идемпотентно. Скрывает обоих друг от друга везде и молча закрывает активный мэтч (обоим match_closed).
      responses:
        '204': { description: OK }
        '400': { description: 'SELF_ACTION', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'PROFILE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /reports:
    post:
      summary: Жалоба на анкету или сообщение
      description: Сохраняется со статусом NEW (очереди модератора пока нет). Лимит app.social.reports-per-hour (20) на аккаунт.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId, reason]
              properties:
                profileId: { type: string, format: uuid }
                messageId: { type: string, format: uuid, description: Сообщение этого человека в моём чате (активном или закрытом) }
                reason: { type: string, enum: [SPAM, FAKE_PROFILE, INAPPROPRIATE_CONTENT, HARASSMENT, SCAM, UNDERAGE, OTHER] }
                comment: { type: string, maxLength: 1000, description: Пустой = без комментария }
      responses:
        '201':
          description: Жалоба принята
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
        '400': { description: 'VALIDATION_ERROR | SELF_ACTION | MALFORMED_REQUEST', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'PROFILE_NOT_FOUND | MESSAGE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /matches:
    get:
      summary: Мои активные мэтчи (экран чатов)
      description: Сначала с самой свежей активностью (последнее сообщение, иначе время мэтча).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /matches/{matchId}:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    delete:
      summary: Размэтч
      description: Скрывает чат для обоих и запрещает новые сообщения; лайки сохраняются. Обоим — match_closed.
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/MatchNotFound' }

  /matches/{matchId}/messages:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    get:
      summary: Сообщения чата (новые первыми, курсор before)
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: id самого старого уже загруженного сообщения }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 100 }, description: '<= 0 или нет → 30, больше 100 → 100' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'MATCH_NOT_FOUND | MESSAGE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Отправить сообщение (TEXT или STICKER)
      description: |
        Идемпотентно по clientMessageId: повтор возвращает исходное сообщение, не считается в лимите и не шлёт событий.
        TEXT — 1..2000 символов после trim, без полей стикера; STICKER — stickerPackCode + sticker из купленного набора, без текста.
        Лимит app.chat.messages-per-minute (30) на аккаунт. Обоим участникам — событие message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: Сообщение (как его видит отправитель)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { description: 'VALIDATION_ERROR | NOT_A_STICKER_PACK | UNKNOWN_STICKER', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'ITEM_NOT_OWNED | ACCOUNT_RESTRICTED (details.kind = MESSAGES, details.until)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'MATCH_NOT_FOUND | ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /matches/{matchId}/read:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    post:
      summary: Отметить прочитанным до сообщения
      description: Указатель двигается только вперёд; если сдвинулся, собеседнику — событие read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadMessageId]
              properties:
                lastReadMessageId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'MATCH_NOT_FOUND | MESSAGE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /events/ticket:
    post:
      summary: Одноразовый билет для подключения к /events из браузера
      description: Действует app.realtime.ticket-ttl (60 с), одно использование.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/push-device:
    put:
      summary: Push-токен этого устройства
      description: |
        Привязан к текущей сессии: выход или истечение сессии останавливают push, удаление аккаунта удаляет устройство.
        Одно устройство на сессию (новый токен заменяет старый); токен из другой сессии переезжает в текущую.
        Регистрировать после каждого входа и при смене токена в SDK. Push уходят после коммита, в т.ч. при открытом
        приложении (в foreground скрывать — то же придёт по SSE). Тексты без имён и текста сообщений.
        data (строки): {type: match, matchId} | {type: message, matchId} | {type: like_received, superlike: 'true'|'false'}.
        Провайдер без серверных ключей выключен: устройства хранятся, push не отправляются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { type: string, enum: [RUSTORE, FCM], description: 'RUSTORE — RuStore Push SDK (Android в РФ); FCM — Firebase (Android с Google-сервисами, iOS через APNs)' }
                token: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '204': { description: Сохранено }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Забыть push-токен этого устройства (идемпотентно)
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events:
    get:
      summary: Поток событий реального времени (SSE)
      description: |
        Авторизация — заголовок Authorization: Bearer ИЛИ ?ticket= из POST /events/ticket (EventSource не умеет заголовки).
        Сессионный токен в URL не принимается. Заголовки ответа: Cache-Control no-cache, X-Accel-Buffering no.
        Каждое событие — `event: <имя>` и `data: <JSON>`. Доставка best effort, без повтора: после ready перезапросить мэтчи и сообщения.
        Соединение закрывается через app.realtime.emitter-timeout (30 мин); не больше app.realtime.max-connections-per-account (5)
        на аккаунт — старейшее закрывается. События отправляются только после коммита транзакции.

        События:
        - ready — { heartbeatSeconds } сразу после подключения
        - heartbeat — { at } каждые app.realtime.heartbeat-interval (25 с)
        - message — Message (как видит получатель; свои сообщения приходят и на другие мои подключения с mine = true)
        - match — Match (новый мэтч, как видит получатель)
        - match_closed — { matchId } (размэтч, блокировка, удаление аккаунта собеседника)
        - like_received — { superlike, count } (без личности; count = /me/likes/received/count .count)
        - read — ReadReceipt (собеседник прочитал чат до сообщения)
      security: []
      parameters:
        - { name: ticket, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Поток Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Формат SSE; data каждого события — JSON (схемы: SseReady, SseHeartbeat, Message, Match, SseMatchClosed, SseLikeReceived, ReadReceipt)'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/boost:
    get:
      summary: Статус буста
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoostStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Включить буст (тратит 1 BOOST)
      description: Повтор с тем же idempotencyKey возвращает тот же буст и не списывает повторно. Бусты не суммируются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdempotencyKeyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoostStatus' }
        '400': { description: 'PROFILE_NOT_PUBLISHED | VALIDATION_ERROR', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'BOOST_ALREADY_ACTIVE | INSUFFICIENT_BALANCE (details.itemCode = BOOST)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gacha/banners:
    get:
      summary: Открытые сейчас баннеры (без pool), по sortOrder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Banner' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /gacha/banners/{code}:
    parameters:
      - { $ref: '#/components/parameters/BannerCode' }
    get:
      summary: Баннер с пулом
      description: Закончившиеся баннеры возвращаются с open false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Banner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'BANNER_NOT_FOUND (неизвестный, выключен или ещё не начался)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gacha/banners/{code}/pull:
    parameters:
      - { $ref: '#/components/parameters/BannerCode' }
    post:
      summary: Крутка (1 или multiPullSize)
      description: Повтор с тем же idempotencyKey возвращает те же результаты с replayed true и ничего не списывает.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, idempotencyKey]
              properties:
                count: { type: integer, minimum: 1, maximum: 100, description: '1 или multiPullSize баннера, иначе 400 INVALID_PULL_COUNT' }
                idempotencyKey: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullResponse' }
        '400': { description: 'INVALID_PULL_COUNT | VALIDATION_ERROR', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'BANNER_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'BANNER_NOT_ACTIVE | INSUFFICIENT_BALANCE (details) | IDEMPOTENCY_KEY_REUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gacha/history:
    get:
      summary: История круток (новые первыми)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: nextBefore из предыдущей страницы }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GachaHistoryItem' } }
                  nextBefore: { type: [integer, 'null'], format: int64 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /gacha/shards:
    get:
      summary: Осколки и курс обмена
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { $ref: '#/components/schemas/Balance' }
                  ticketItemCode: { type: string }
                  shardsPerTicket: { type: integer, example: 30 }
                  maxTicketsPerExchange: { type: integer, example: 100 }
                  duplicateShards:
                    type: object
                    additionalProperties: { type: integer }
                    example: { COMMON: 1, RARE: 5, EPIC: 20, LEGENDARY: 60 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /gacha/shards/exchange:
    post:
      summary: Обмен осколков на билеты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tickets, idempotencyKey]
              properties:
                tickets: { type: integer, minimum: 1, description: 'до maxTicketsPerExchange' }
                idempotencyKey: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: OK (applied false — ключ уже использован, ничего не изменилось)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  tickets: { type: integer }
                  shardsSpent: { type: integer, format: int64 }
                  shardBalance: { $ref: '#/components/schemas/Balance' }
                  ticketBalance: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/InsufficientBalance' }

  # ------------------------------------------------------------------ admin

  /admin/roles:
    get:
      tags: [admin]
      summary: Роли и аккаунты с ролями
      description: 'Роль: ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: array, items: { type: string }, example: [ADMIN, CONTENT_EDITOR, MODERATOR] }
                  accounts: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/accounts/by-phone:
    get:
      tags: [admin]
      summary: Найти аккаунт по телефону
      description: 'Роль: ADMIN. Телефон нормализуется и хэшируется как при входе.'
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { description: 'INVALID_PHONE (fieldErrors.phone) | MALFORMED_REQUEST', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ACCOUNT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/accounts/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      tags: [admin]
      summary: Аккаунт по id
      description: 'Роль: ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ACCOUNT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/accounts/{accountId}/roles/{role}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { name: role, in: path, required: true, schema: { type: string, enum: [ADMIN, CONTENT_EDITOR, MODERATOR] }, description: Без учёта регистра }
    put:
      tags: [admin]
      summary: Выдать роль (идемпотентно)
      description: 'Роль: ADMIN. Пишется в аудит (ACCOUNT_ROLE, GRANT).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { description: 'UNKNOWN_ROLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ACCOUNT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'ACCOUNT_NOT_ACTIVE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [admin]
      summary: Снять роль (идемпотентно)
      description: 'Роль: ADMIN. Последний активный ADMIN не может потерять роль.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { description: 'UNKNOWN_ROLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ACCOUNT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'LAST_ADMIN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/audit:
    get:
      tags: [admin]
      summary: Журнал аудита (новые первыми)
      description: 'Роль: ADMIN.'
      parameters:
        - { name: entityType, in: query, schema: { type: string, enum: [ACCOUNT_ROLE, TAG, TAG_CATEGORY, GOAL, CATALOG_ITEM, AUTHOR, ACHIEVEMENT, PREMIUM_COMPOSITION, GACHA_BANNER, REPORT] } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 }, description: Приводится к 1..200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/reports:
    get:
      tags: [admin]
      summary: Очередь жалоб (старые первыми)
      description: 'Роли: MODERATOR или ADMIN.'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NEW, IN_REVIEW, RESOLVED, DISMISSED] }, description: Без учёта регистра; не задан — открытые (NEW, IN_REVIEW) }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: Вне 1..100 — 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/reports/{reportId}:
    get:
      tags: [admin]
      summary: Жалоба
      description: 'Роли: MODERATOR или ADMIN. 404 REPORT_NOT_FOUND.'
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/reports/{reportId}/decision:
    post:
      tags: [admin]
      summary: Решение по жалобе
      description: |
        Роли: MODERATOR или ADMIN. ACCEPTED — нарушение подтверждено как в жалобе (status RESOLVED);
        RECLASSIFIED — нарушение другого вида, reason обязателен и отличается от причины в жалобе (RESOLVED);
        REJECTED — нарушения нет (DISMISSED). reason допустим только с RECLASSIFIED. Подтверждённое нарушение получает
        шаг политики санкций своей finalReason (если sanction не false — например, для дубля уже наказанного нарушения)
        и может удалить фото анкеты и тексты. Каждое решение пересчитывает срочное скрытие. Пишется в аудит (REPORT).
        Ошибки: 400 VALIDATION_ERROR (fieldErrors.reason; удаление контента при REJECTED), 404 REPORT_NOT_FOUND,
        404 PHOTO_NOT_FOUND, 409 REPORT_ALREADY_DECIDED.
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, RECLASSIFIED, REJECTED] }
                reason: { $ref: '#/components/schemas/ReportReason' }
                note: { type: string, maxLength: 1000 }
                sanction: { type: boolean, default: true, description: Применить политику санкций }
                removePhotoIds: { type: array, maxItems: 6, items: { type: string, format: uuid } }
                clearAboutText: { type: boolean, default: false }
                clearDailyStatus: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationReport' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /me/restrictions:
    get:
      summary: Мои действующие ограничения
      description: Показывать пользователю, почему не работают лайки или сообщения и до какого времени.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind: { $ref: '#/components/schemas/RestrictionKind' }
                    reason: { type: string }
                    startsAt: { type: string, format: date-time }
                    endsAt: { type: [string, 'null'], format: date-time, description: null — до снятия модерацией }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/accounts/{accountId}/restrictions:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      tags: [admin]
      summary: История ограничений аккаунта (новые первыми)
      description: 'Роли: MODERATOR или ADMIN. 404 ACCOUNT_NOT_FOUND.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Restriction' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Ручное ограничение
      description: 'Роли: MODERATOR или ADMIN. reason = MANUAL. SUSPENDED удаляет все лайки аккаунта и закрывает мэтчи. 409 ACCOUNT_DELETED.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/RestrictionKind' }
                hours: { type: integer, minimum: 1, maximum: 87600, description: Не задано — до снятия }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restriction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/accounts/{accountId}/behavior:
    get:
      tags: [admin]
      summary: Поведенческие метрики аккаунта (пересчитываются при запросе)
      description: |
        Роли: MODERATOR или ADMIN. Также пересчитываются ночью для аккаунтов, активных за 90 дней. Только числа —
        текст сообщений не копируется и не возвращается. Доли = null, если делить не на что.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string, format: uuid }
                  computedAt: { type: string, format: date-time }
                  metrics: { $ref: '#/components/schemas/BehaviorMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/restrictions/{restrictionId}/lift:
    post:
      tags: [admin]
      summary: Снять ограничение
      description: 'Роль: ADMIN. Удалённые лайки не возвращаются. 404 RESTRICTION_NOT_FOUND, 409 RESTRICTION_NOT_ACTIVE.'
      parameters:
        - { name: restrictionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restriction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/sanction-policy:
    get:
      tags: [admin]
      summary: Политика санкций по причинам жалоб
      description: 'Роли: MODERATOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SanctionPolicy' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/sanction-policy/{reason}:
    put:
      tags: [admin]
      summary: Изменить политику для причины
      description: 'Роль: ADMIN. reason — причина жалобы (без учёта регистра), иначе 400 VALIDATION_ERROR. Пишется в аудит (SANCTION_POLICY).'
      parameters:
        - { name: reason, in: path, required: true, schema: { $ref: '#/components/schemas/ReportReason' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowDays, steps]
              properties:
                windowDays: { type: integer, minimum: 1, maximum: 3650 }
                holdOnReports: { type: [integer, 'null'], minimum: 1, maximum: 100 }
                steps: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/SanctionStep' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanctionPolicy' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /me/verification:
    get:
      summary: Статус подтверждения селфи
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  verifiedAt: { type: [string, 'null'], format: date-time }
                  current: { oneOf: [ { $ref: '#/components/schemas/VerificationRequest' }, { type: 'null' } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Начать подтверждение (случайный жест)
      description: |
        Возвращает открытый запрос (с тем же жестом) или создаёт новый. Модератор сравнивает селфи с фото анкеты
        вручную (без автоматического сравнения лиц); селфи удаляется сразу после решения. Одобрение даёт бейдж verified
        и снимает VERIFICATION_REQUIRED; новое фото в анкете снимает бейдж. 409 ALREADY_VERIFIED | VERIFICATION_PENDING,
        429 — больше 3 запросов в сутки.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/verification/{requestId}/selfie:
    post:
      summary: Загрузить селфи с жестом
      description: 'JPEG/PNG/WebP до 5 МБ, метаданные удаляются. 404 VERIFICATION_NOT_FOUND, 409 VERIFICATION_EXPIRED | VERIFICATION_NOT_AWAITING.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: На проверке
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /admin/verifications:
    get:
      tags: [admin]
      summary: Очередь проверки селфи (старые первыми)
      description: 'Роли: MODERATOR или ADMIN.'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [AWAITING_SELFIE, PENDING, APPROVED, REJECTED, EXPIRED], default: PENDING } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VerificationReview' } }
                  page: { type: integer }
                  limit: { type: integer }
                  totalElements: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/verifications/{requestId}:
    get:
      tags: [admin]
      summary: Запрос проверки
      description: 'Роли: MODERATOR или ADMIN. 404 VERIFICATION_NOT_FOUND.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/verifications/{requestId}/selfie:
    get:
      tags: [admin]
      summary: Само селфи (только с заголовком Authorization, не кэшируется)
      description: 'Роли: MODERATOR или ADMIN. 404 SELFIE_NOT_FOUND — решение уже принято и файл удалён.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Изображение
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/verifications/{requestId}/decision:
    post:
      tags: [admin]
      summary: Одобрить или отклонить селфи
      description: 'Роли: MODERATOR или ADMIN. Отказ требует причину (её видит пользователь). Селфи удаляется. 409 VERIFICATION_NOT_PENDING.'
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationReview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/accounts/{accountId}/risk:
    get:
      tags: [admin]
      summary: Риск бота / фейка (пересчитывается при запросе)
      description: |
        Роли: MODERATOR или ADMIN. Правила с весами, сумма до 100: SIGNUP_BURST, DUPLICATE_PHOTO, DUPLICATE_ABOUT,
        CONTACTS_IN_PROFILE, SAME_MESSAGE_TO_MANY, CONTACTS_IN_MESSAGES, LIKE_SPAM, BOT_MESSAGES, REPORTED_BY_MANY,
        REPORTED_AS_FAKE, NEW_ACCOUNT. Скор только сортирует очередь и даёт контекст, сам ничего не наказывает.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Risk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/risk:
    get:
      tags: [admin]
      summary: Очередь рискованных аккаунтов (ACTIVE, самые рискованные первыми)
      description: 'Роли: MODERATOR или ADMIN. Автоматическое правило: один и тот же текст со ссылками/контактами в 3+ чатах за сутки → MESSAGES на 24 ч (BOT_MESSAGES).'
      parameters:
        - { name: minScore, in: query, schema: { type: integer, default: 30, minimum: 0, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: { type: string, format: uuid }
                        profileId: { type: [string, 'null'], format: uuid }
                        displayName: { type: [string, 'null'] }
                        score: { type: integer }
                        level: { type: string, enum: [LOW, MEDIUM, HIGH] }
                        signals: { type: array, items: { $ref: '#/components/schemas/RiskSignal' } }
                        computedAt: { type: string, format: date-time }
                  page: { type: integer }
                  limit: { type: integer }
                  totalElements: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/tags:
    get:
      tags: [admin]
      summary: Все карточки, включая скрытые
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminTag' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    post:
      tags: [admin]
      summary: Создать карточку
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code]
                  properties:
                    code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
                - { $ref: '#/components/schemas/AdminTagFields' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTag' }
        '400': { description: 'VALIDATION_ERROR | UNKNOWN_CATEGORY', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '409': { description: 'TAG_EXISTS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tags/{code}:
    parameters:
      - { $ref: '#/components/parameters/Code' }
    put:
      tags: [admin]
      summary: Изменить карточку (полная замена полей)
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTagFields' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTag' }
        '400': { description: 'VALIDATION_ERROR | UNKNOWN_CATEGORY', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'TAG_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [admin]
      summary: Удалить карточку (используемая скрывается)
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'TAG_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tag-categories:
    get:
      tags: [admin]
      summary: Категории карточек
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    post:
      tags: [admin]
      summary: Создать категорию
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label]
              properties:
                code: { type: string, pattern: '^[a-z][a-z0-9_]{1,29}$' }
                label: { type: string, minLength: 1, maxLength: 50 }
                sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '409': { description: 'CATEGORY_EXISTS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tag-categories/{code}:
    parameters:
      - { $ref: '#/components/parameters/Code' }
    put:
      tags: [admin]
      summary: Изменить категорию
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 50 }
                sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'CATEGORY_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [admin]
      summary: Удалить пустую категорию
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'CATEGORY_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'CATEGORY_IN_USE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/tag-categories/{code}/scale:
    put:
      tags: [admin]
      summary: Расставить карточки категории по шкале (для процента совпадения)
      description: |
        Роли: CONTENT_EDITOR или ADMIN. Заменяет шкалу целиком: карточки, которых нет в positions, теряют место;
        scale=false выключает шкалу. Шкале нужны обе подписи и хотя бы две карточки ЭТОЙ категории.
        404 CATEGORY_NOT_FOUND, 400 VALIDATION_ERROR. Пишется в аудит (TAG_CATEGORY, SET_SCALE).
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scale]
              properties:
                scale: { type: boolean }
                scaleMinLabel: { type: string, maxLength: 60 }
                scaleMaxLabel: { type: string, maxLength: 60 }
                positions: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 100 }, description: 'Код карточки → место (меньше = ближе к scaleMinLabel)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/goals:
    get:
      tags: [admin]
      summary: Все цели знакомства
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminGoal' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    post:
      tags: [admin]
      summary: Создать цель
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code]
                  properties:
                    code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
                - { $ref: '#/components/schemas/AdminGoalFields' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGoal' }
