              properties:
                profile: { $ref: '#/components/schemas/ProfileUpdate' }
                premiumDays: { type: integer, minimum: 0, maximum: 3650 }
                cosmetics: { type: array, maxItems: 10, items: { type: string }, description: Надеваемые надеваются }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedProfile' }
        '400': { description: 'VALIDATION_ERROR | UNKNOWN_TAG | UNKNOWN_GOAL', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { description: 'ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
