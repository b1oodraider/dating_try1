        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    post:
      tags: [admin]
      summary: Создать предмет
      description: |
        Роли: CONTENT_EDITOR или ADMIN. code, kind, category и equipSlot после создания не меняются.
        Атрибуты проверяются по категории (см. docs/api-contract.md); только ошибки attributes.* — 400 INVALID_ATTRIBUTES.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogItemRequest' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '400': { description: 'VALIDATION_ERROR | INVALID_ATTRIBUTES', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '409': { description: 'ITEM_EXISTS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/catalog/items/{code}:
