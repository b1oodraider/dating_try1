      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBanner' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'BANNER_NOT_FOUND | ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [admin]
      summary: Удалить баннер без круток
      description: 'Роли: CONTENT_EDITOR или ADMIN. С крутками — 409 BANNER_HAS_PULLS (выключите вместо удаления).'
