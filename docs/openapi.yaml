        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'BANNER_NOT_FOUND | POOL_ENTRY_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

