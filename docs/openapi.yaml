      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [admin]
      summary: Изменить предмет (полная замена редактируемых полей)
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCatalogItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '400': { description: 'VALIDATION_ERROR | INVALID_ATTRIBUTES', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/catalog/items/{code}/image:
    parameters:
      - { $ref: '#/components/parameters/Code' }
    post:
      tags: [admin]
      summary: Загрузить картинку предмета (ставит attributes.imageUrl)
      description: 'Роли: CONTENT_EDITOR или ADMIN. JPEG/PNG/WebP по содержимому, до 5 МБ, метаданные удаляются.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogEntry' }
        '400': { description: 'EMPTY_FILE | MALFORMED_REQUEST', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ITEM_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /admin/authors:
