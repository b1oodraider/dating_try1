        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
    post:
      tags: [testing]
      summary: Создать сид-профиль (DRAFT; тестовый аккаунт без телефона)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
