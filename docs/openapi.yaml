      tags: [admin]
      summary: Определения достижений
      description: 'Роли: CONTENT_EDITOR или ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AchievementDefinition' } }
