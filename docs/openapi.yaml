        completedAt: { type: [string, 'null'], format: date-time }
        rewards: { type: array, items: { $ref: '#/components/schemas/Reward' } }

    CatalogItem:
      type: object
      properties:
        code: { type: string }
        kind: { type: string, enum: [CONSUMABLE, COSMETIC] }
        category: { type: string }
        equipSlot: { type: [string, 'null'] }
        rarity: { type: [string, 'null'] }
        title: { type: string }
        attributes: { type: object, additionalProperties: true, description: 'imageUrl (необязательно) — относительная публичная ссылка /api/v1/catalog/images/{id}' }
