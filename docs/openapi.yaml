        mine: { type: boolean }
        type: { type: string, enum: [TEXT, STICKER] }
        text: { type: [string, 'null'] }
        stickerPackCode: { type: [string, 'null'] }
        sticker: { type: [string, 'null'], description: Код из attributes.stickers набора }
        clientMessageId: { type: [string, 'null'], description: Только в моих сообщениях }
        createdAt: { type: string, format: date-time }

    MessagePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' }, description: Новые первыми }
