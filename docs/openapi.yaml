        '403': { $ref: '#/components/responses/RoleRequired' }

  /admin/achievements/{code}:
    parameters:
      - { $ref: '#/components/parameters/Code' }
    put:
      tags: [admin]
      summary: Изменить достижение (полная замена; коды фиксированы)
      description: 'Роли: CONTENT_EDITOR или ADMIN. ITEM — активный предмет, quantity 1..1000 (косметика ровно 1); PREMIUM_DAYS — days 1..3650.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rewards, active]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 300, description: Пустое = null }
                rewards: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Reward' } }
                active: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AchievementDefinition' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
        '404': { description: 'ACHIEVEMENT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/premium:
    get:
      tags: [admin]
      summary: Состав премиума
      description: 'Роль: ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    put:
      tags: [admin]
      summary: Переопределить состав премиума (null/нет списка — без изменений)
      description: 'Роль: ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                features:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
                allowances:
                  type: array
                  maxItems: 20
                  description: Не больше одной выдачи на пару предмет+период
                  items:
                    type: object
                    required: [itemCode, quantity, period, mode]
                    properties:
                      itemCode: { type: string, description: Активный расходник }
                      quantity: { type: integer, format: int64, minimum: 1, maximum: 1000 }
                      period: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
                      mode: { type: string, enum: [TOP_UP, ADD] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }
    delete:
      tags: [admin]
      summary: Вернуть состав премиума к конфигу (app.economy.*)
      description: 'Роль: ADMIN.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremiumView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleRequired' }

