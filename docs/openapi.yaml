      summary: Удалить все сид-профили
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/profiles/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    put:
      tags: [testing]
      summary: Изменить сид-профиль
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedProfile' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }
    delete:
      tags: [testing]
      summary: Удалить сид-профиль
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }

  /testing/profiles/{accountId}/photos:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      tags: [testing]
      summary: Загрузить фото сид-профиля (правила как у /me/profile/photos)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /testing/profiles/{accountId}/publish:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      tags: [testing]
      summary: Опубликовать сид-профиль
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedProfile' }
        '400': { description: 'PROFILE_INCOMPLETE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }

  /testing/gacha/state:
    get:
      tags: [testing]
      summary: Состояние гачи для тестов
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/gacha/banners/{code}/forced:
    parameters:
      - { $ref: '#/components/parameters/BannerCode' }
    put:
      tags: [testing]
      summary: Следующие крутки баннера вернут эти позиции по порядку (pityTrigger FORCED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryIds]
              properties:
                entryIds: { type: array, maxItems: 100, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { description: 'POOL_ENTRY_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /testing/gacha/forced:
    delete:
      tags: [testing]
      summary: Очистить все принудительные очереди
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/gacha/pity/{pityGroup}:
    parameters:
      - { name: pityGroup, in: path, required: true, schema: { type: string } }
    put:
      tags: [testing]
      summary: Установить счётчики гаранта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pullsSinceEpic: { type: integer, minimum: 0, maximum: 10000 }
                pullsSinceLegendary: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/gacha/pity:
    delete:
      tags: [testing]
      summary: Сбросить все счётчики гаранта
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/gacha/history:
    delete:
      tags: [testing]
      summary: Удалить историю круток (кошелёк и счётчики остаются)
      responses:
        '200': { $ref: '#/components/responses/GachaTestingState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/boost:
    parameters:
      - { name: accountId, in: query, schema: { type: string, format: uuid }, description: 'Сид-профиль вместо вызывающего (иначе 404 SEED_PROFILE_NOT_FOUND)' }
    get:
      tags: [testing]
      summary: Состояние бустов
      responses:
        '200': { $ref: '#/components/responses/TestBoostState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }
    post:
      tags: [testing]
      summary: Запустить буст без списания
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        '200': { $ref: '#/components/responses/TestBoostState' }
        '400': { description: 'PROFILE_NOT_PUBLISHED | VALIDATION_ERROR', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }
        '409': { description: 'BOOST_ALREADY_ACTIVE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [testing]
      summary: Закончить буст сейчас
      responses:
        '200': { $ref: '#/components/responses/TestBoostState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }

  /testing/boost/impressions:
    parameters:
      - { name: accountId, in: query, schema: { type: string, format: uuid } }
    put:
      tags: [testing]
      summary: Установить показы активного (иначе последнего) буста
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [impressions]
              properties:
                impressions: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
      responses:
        '200': { $ref: '#/components/responses/TestBoostState' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { description: 'BOOST_NOT_FOUND | SEED_PROFILE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /testing/social/seed/{seedAccountId}/like-me:
    parameters:
      - { $ref: '#/components/parameters/SeedAccountId' }
    post:
      tags: [testing]
      summary: Сид-профиль лайкает меня (без проверок ленты и списаний)
      description: Если я уже лайкнул этот профиль — мэтч.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                superlike: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }

  /testing/social/seed/{seedAccountId}/match:
    parameters:
      - { $ref: '#/components/parameters/SeedAccountId' }
    post:
      tags: [testing]
      summary: Мгновенный мэтч с сид-профилем
      description: Оба лайкают друг друга; активный мэтч есть после вызова (новый, даже если прежний был закрыт).
      responses:
        '200':
          description: OK (matched true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { $ref: '#/components/responses/SeedNotFound' }

  /testing/social/matches/{matchId}/messages:
    parameters:
      - { $ref: '#/components/parameters/MatchId' }
    post:
      tags: [testing]
      summary: Сид-профиль из моего мэтча пишет мне
      description: Тело как у POST /matches/{matchId}/messages, но clientMessageId необязателен (генерируется), type по умолчанию TEXT. Ошибки чата те же.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientMessageId: { type: string, maxLength: 64 }
                type: { type: string, enum: [TEXT, STICKER], default: TEXT }
                text: { type: string, maxLength: 4000 }
                stickerPackCode: { type: string, maxLength: 50 }
                sticker: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Сообщение как его вижу я (mine false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
        '404': { description: 'MATCH_NOT_FOUND | SEED_PROFILE_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /testing/social/passes:
    delete:
      tags: [testing]
      summary: Забыть мои пропуски (анкеты вернутся в ленту)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/social/reactions:
    delete:
      tags: [testing]
      summary: Забыть все мои лайки, суперлайки и пропуски (мэтчи остаются)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

  /testing/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: string, enum: [ADMIN, CONTENT_EDITOR, MODERATOR] } }
    post:
      tags: [testing]
      summary: Выдать себе роль персонала (аудит TESTING_GRANT)
      responses:
        '200':
          description: Аккаунт, как GET /me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: 'UNKNOWN_ROLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }
    delete:
      tags: [testing]
      summary: Снять с себя роль (аудит TESTING_REVOKE, без защиты последнего ADMIN)
      responses:
        '200':
          description: Аккаунт, как GET /me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: 'UNKNOWN_ROLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TestAccountRequired' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, format: uuid }, description: PublicProfile.id (не id аккаунта) }
    MatchId: { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
    BannerCode: { name: code, in: path, required: true, schema: { type: string } }
    Code: { name: code, in: path, required: true, schema: { type: string } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    SeedAccountId: { name: seedAccountId, in: path, required: true, schema: { type: string, format: uuid }, description: SeedProfile.accountId }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет токена, токен истёк/отозван или аккаунт не активен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: RATE_LIMITED
      headers:
        Retry-After:
          schema: { type: integer }
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    PremiumRequired:
      description: PREMIUM_REQUIRED, details.feature — код премиум-функции (показать пейвол)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientBalance:
      description: INSUFFICIENT_BALANCE, details { itemCode, available }; ничего не списано
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RoleRequired:
      description: ROLE_REQUIRED, details.roles — любая из этих ролей дала бы доступ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TestAccountRequired:
      description: TEST_ACCOUNT_REQUIRED — доступно только тестовым аккаунтам
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MatchNotFound:
      description: MATCH_NOT_FOUND (не мой, размэтчен, заблокирован)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SeedNotFound:
      description: SEED_PROFILE_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TestingState:
      description: Состояние тестового аккаунта
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TestingState' }
    GachaTestingState:
      description: Состояние гачи для тестов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GachaTestingState' }
    TestBoostState:
      description: Состояние бустов для тестов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TestBoostState' }

  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string, description: Сообщение для пользователя (рус.) }
        traceId: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
        details:
          type: object
          description: 'Машиночитаемые подробности: PREMIUM_REQUIRED {feature}, INSUFFICIENT_BALANCE {itemCode, available}, ROLE_REQUIRED {roles}'
          additionalProperties: true

    AuthChallenge:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        maskedPhone: { type: string, example: '+7 *** ***-**-67' }
        devMockCode: { type: string, description: Только в dev-режиме с mock OTP }

    AuthSession:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        accountId: { type: string, format: uuid }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        phoneMasked: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETION_PENDING, DELETED] }
        createdAt: { type: string, format: date-time }
        testAccount: { type: boolean, description: QA-аккаунт; клиент показывает тестовую панель }
        roles:
          type: array
          description: Роли персонала (отсортированы); пусто у обычных пользователей
          items: { type: string, enum: [ADMIN, CONTENT_EDITOR, MODERATOR] }

    Tag:
      type: object
      properties:
        code: { type: string }
        category: { type: string, description: 'Код категории (исходно pace, format, calls, boundaries, social; редактируется через /admin/tag-categories)' }
        categoryLabel: { type: string }
        label: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        scalePosition: { type: [integer, 'null'], description: Место на шкале категории (меньше — ближе к её началу); null — категория не шкала }

    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: 'Относительная подписанная ссылка, действует ~1 час' }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sortOrder: { type: integer }
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }

    MyProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }
        age: { type: [integer, 'null'] }
        city: { type: [string, 'null'] }
        aboutText: { type: [string, 'null'] }
        publicationStatus: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN] }
        dailyStatusText: { type: [string, 'null'], description: null после истечения 24 часов }
        dailyStatusExpiresAt: { type: [string, 'null'], format: date-time }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        completenessPercent: { type: integer, minimum: 0, maximum: 100 }
        missingForPublish:
          type: array
          items: { type: string, enum: [displayName, age, city, photos] }
        decorations: { $ref: '#/components/schemas/Decorations' }
        heightCm: { type: [integer, 'null'] }
        goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        premium: { type: boolean }
        verified: { type: boolean, description: Селфи подтверждено модератором }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PublicProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        age: { type: integer }
        city: { type: string }
        aboutText: { type: [string, 'null'] }
        dailyStatusText: { type: [string, 'null'] }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        decorations: { $ref: '#/components/schemas/Decorations' }
        heightCm: { type: [integer, 'null'] }
        goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        premium: { type: boolean, description: Бейдж премиума }
        verified: { type: boolean, description: Селфи подтверждено модератором }
        compatibility:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Совпадение со СМОТРЯЩИМ по карточкам. Учитываются категории, заполненные обоими, с равным весом:
            шкала — 1 − |среднее место A − среднее место B| / длина шкалы; остальные — общие карточки / меньший выбор.
            null, если общих категорий меньше двух.
        boosted: { type: boolean, description: 'Только при app.boost.public-badge=true и активном бусте; иначе поля нет' }

    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 50, description: После trim }
        age: { type: integer, minimum: 18, maximum: 100 }
        city: { type: string, minLength: 1, maxLength: 60 }
        aboutText: { type: string, maxLength: 1000, description: Пустая строка очищает }
        tagCodes: { type: array, maxItems: 10, items: { type: string } }
        dailyStatusText: { type: string, maxLength: 200, description: Пустая строка очищает; иначе действует 24 часа }
        heightCm: { type: integer, minimum: 120, maximum: 230 }
        goalCodes: { type: array, maxItems: 3, items: { type: string }, description: 'Известные коды (иначе 400 UNKNOWN_GOAL); [] очищает' }
        clearHeight: { type: boolean, description: 'true удаляет рост; вместе с heightCm — 400 fieldErrors.heightCm' }

    ExclusionWords:
      type: object
      properties:
        words: { type: array, items: { type: string } }
        maxWords: { type: integer, example: 20 }
        active: { type: boolean, description: 'false — премиум закончился, список сохранён, но не применяется' }

    DiscoveryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicProfile' } }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Goal:
      type: object
      properties:
        code: { type: string, example: SERIOUS_RELATIONSHIP }
        label: { type: string }
        sortOrder: { type: integer }

    ExcludedGoals:
      type: object
      properties:
        goalCodes: { type: array, items: { type: string } }
        active: { type: boolean, description: 'false — премиум закончился, фильтр сохранён, но не применяется' }

    Decoration:
      type: object
      description: Рисовать по attributes; неизвестные ключи и слоты игнорировать
