        clientMessageId: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [TEXT, STICKER] }
        text: { type: string, maxLength: 4000, description: 'TEXT: 1..2000 символов после trim' }
        stickerPackCode: { type: string, maxLength: 50 }
        sticker: { type: string, maxLength: 50 }

    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/PublicProfile' }
        lastMessage:
          oneOf:
            - { $ref: '#/components/schemas/Message' }
            - { type: 'null' }
        unreadCount: { type: integer, format: int64 }
        myLastReadMessageId: { type: [string, 'null'], format: uuid }
        otherLastReadMessageId: { type: [string, 'null'], format: uuid }
        otherLastReadAt: { type: [string, 'null'], format: date-time }

    ReadState:
      type: object
      properties:
        matchId: { type: string, format: uuid }
        lastReadMessageId: { type: string, format: uuid }
        lastReadAt: { type: string, format: date-time }
        unreadCount: { type: integer, format: int64 }

    ReadReceipt:
      type: object
      description: data события read
      properties:
        matchId: { type: string, format: uuid }
        lastReadMessageId: { type: string, format: uuid }
        lastReadAt: { type: string, format: date-time }

    SseReady:
      type: object
      description: data события ready
      properties:
        heartbeatSeconds: { type: integer }

    SseHeartbeat:
      type: object
      description: data события heartbeat
      properties:
        at: { type: string, format: date-time }

    SseMatchClosed:
      type: object
      description: data события match_closed
      properties:
        matchId: { type: string, format: uuid }

    SseLikeReceived:
      type: object
      description: data события like_received
      properties:
        superlike: { type: boolean }
        count: { type: integer, format: int64 }

    BoostRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        impressions: { type: integer, format: int64 }

    BoostStatus:
      type: object
      properties:
        active: { type: boolean }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        impressions: { type: integer, format: int64 }
        available: { type: integer, format: int64, description: Баланс BOOST }
        durationMinutes: { type: integer, format: int64 }
        now: { type: string, format: date-time, description: «Сейчас» по часам владельца (для тестовых аккаунтов сдвинуто) }
        history: { type: array, items: { $ref: '#/components/schemas/BoostRecord' }, description: 'Последние 10, новые первыми' }

    Balance:
      type: object
      properties:
        itemCode: { type: string }
        quantity: { type: integer, format: int64 }

    GachaReward:
      type: object
      properties:
        type: { type: string, enum: [ITEM, PREMIUM_DAYS] }
        item:
          type: [object, 'null']
          properties:
            code: { type: string }
            kind: { type: string, enum: [CONSUMABLE, COSMETIC] }
            category: { type: string }
            title: { type: string }
            rarity: { type: [string, 'null'] }
            equipSlot: { type: [string, 'null'] }
            attributes: { type: object, additionalProperties: true }
        quantity: { type: [integer, 'null'], format: int64 }
        days: { type: [integer, 'null'] }

    PityRules:
      type: object
      properties:
        epicOrBetterWithin: { type: [integer, 'null'] }
        legendaryWithin: { type: [integer, 'null'] }
        softPityStartsAt: { type: [integer, 'null'] }
        softPityLegendaryWeightStep: { type: integer, format: int64 }

    PityProgress:
      type: object
      properties:
        pityGroup: { type: string }
        pullsSinceEpic: { type: integer }
        pullsSinceLegendary: { type: integer }
        epicGuaranteedIn: { type: [integer, 'null'], description: 1 — следующая крутка гарантирована }
        legendaryGuaranteedIn: { type: [integer, 'null'] }
        totalPulls: { type: integer, format: int64 }

    Rarity:
      type: string
      enum: [COMMON, RARE, EPIC, LEGENDARY]

    PoolEntry:
      type: object
      properties:
        entryId: { type: string }
        rarity: { $ref: '#/components/schemas/Rarity' }
        reward: { $ref: '#/components/schemas/GachaReward' }
        weight: { type: integer, format: int64 }
        percent: { type: number, description: 4 знака после запятой }
        featured: { type: boolean }

    BannerRates:
      type: object
      properties:
        totalWeight: { type: integer, format: int64 }
        rarities:
          type: array
          items:
            type: object
            properties:
              rarity: { $ref: '#/components/schemas/Rarity' }
              weight: { type: integer, format: int64 }
              percent: { type: number }

    Banner:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        type: { type: string, enum: [PERMANENT, LIMITED] }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        open: { type: boolean }
        attributes: { type: object, additionalProperties: true }
        cost:
          type: object
          properties:
            itemCode: { type: string }
            perPull: { type: integer }
            multiPullSize: { type: integer }
            multiPullCost: { type: integer, format: int64 }
        pityRules: { $ref: '#/components/schemas/PityRules' }
        myPity: { $ref: '#/components/schemas/PityProgress' }
        rates: { $ref: '#/components/schemas/BannerRates' }
        featured: { type: array, items: { $ref: '#/components/schemas/PoolEntry' } }
        pool: { type: array, items: { $ref: '#/components/schemas/PoolEntry' }, description: 'Только в GET /gacha/banners/{code}' }

    PullResult:
      type: object
      properties:
        index: { type: integer }
        entryId: { type: string }
        rarity: { $ref: '#/components/schemas/Rarity' }
        reward: { $ref: '#/components/schemas/GachaReward' }
        isNew: { type: boolean }
        outcome: { type: string, enum: [NEW, DUPLICATE_SHARDS] }
        shardsGranted: { type: integer }
        pityTrigger: { type: [string, 'null'], enum: [EPIC_PITY, LEGENDARY_PITY, FORCED, null] }

    PullResponse:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        bannerCode: { type: string }
        count: { type: integer }
        replayed: { type: boolean }
        results: { type: array, items: { $ref: '#/components/schemas/PullResult' } }
        shardsGranted: { type: integer }
        pity: { $ref: '#/components/schemas/PityProgress' }
        costBalance: { $ref: '#/components/schemas/Balance' }
        shardBalance: { $ref: '#/components/schemas/Balance' }

    GachaHistoryItem:
      allOf:
        - { $ref: '#/components/schemas/PullResult' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            requestId: { type: string, format: uuid }
            bannerCode: { type: string }
            bannerTitle: { type: string }
            createdAt: { type: string, format: date-time }

    AdminAccount:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        phoneMasked: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETION_PENDING, DELETED] }
        testAccount: { type: boolean }
        roles: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorAccountId: { type: string, format: uuid }
        action: { type: string, description: 'CREATE, UPDATE, DELETE, DEACTIVATE, GRANT, REVOKE, TESTING_GRANT, TESTING_REVOKE, IMAGE_UPLOAD, RESET, …' }
        entityType: { type: string }
        entityId: { type: string }
        before: { description: Снимок до изменения (любой JSON или null) }
        after: { description: Снимок после изменения (любой JSON или null) }
        createdAt: { type: string, format: date-time }

    ReportReason:
      type: string
      enum: [SPAM, FAKE_PROFILE, INAPPROPRIATE_CONTENT, HARASSMENT, SCAM, UNDERAGE, OTHER]

    ModerationReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [NEW, IN_REVIEW, RESOLVED, DISMISSED] }
        reason: { $ref: '#/components/schemas/ReportReason' }
        finalReason:
          description: Подтверждённое нарушение (null, пока нет решения, и при REJECTED)
          oneOf: [ { $ref: '#/components/schemas/ReportReason' }, { type: 'null' } ]
        decision: { type: [string, 'null'], enum: [ACCEPTED, RECLASSIFIED, REJECTED, null] }
        sanctioned: { type: boolean, description: Политика санкций применена }
        reportedRiskScore: { type: [integer, 'null'], description: Риск бота / фейка 0..100 }
        comment: { type: [string, 'null'] }
        messageId: { type: [string, 'null'], format: uuid }
        messageSnapshot: { type: [string, 'null'] }
        reporterAccountId: { type: string, format: uuid }
        reportedAccountId: { type: string, format: uuid }
        reportedProfileId: { type: string, format: uuid }
        reportedDisplayName: { type: [string, 'null'], description: 'null, если анкеты уже нет' }
        reportedConfirmedViolations: { type: integer, description: Жалобы на этот аккаунт с решением ACCEPTED или RECLASSIFIED }
        createdAt: { type: string, format: date-time }
        moderatorAccountId: { type: [string, 'null'], format: uuid }
        moderatorNote: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }

    VerificationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [AWAITING_SELFIE, PENDING, APPROVED, REJECTED, EXPIRED] }
        gesture: { type: string, description: Код жеста }
        instruction: { type: string, description: Что показать на селфи }
        expiresAt: { type: string, format: date-time, description: До какого времени загрузить селфи }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }

    VerificationReview:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        profileId: { type: [string, 'null'], format: uuid }
        displayName: { type: [string, 'null'] }
        status: { type: string }
        gesture: { type: string }
        instruction: { type: string }
        selfieAvailable: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        rejectReason: { type: [string, 'null'] }
        profilePhotos: { type: array, items: { $ref: '#/components/schemas/Photo' } }

    RiskSignal:
      type: object
      properties:
        code: { type: string }
        weight: { type: integer }
        detail: { type: string }

    Risk:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        signals: { type: array, items: { $ref: '#/components/schemas/RiskSignal' } }
        computedAt: { type: string, format: date-time }

    BehaviorMetrics:
      type: object
      properties:
        likesGiven30d: { type: integer }
        superlikesGiven30d: { type: integer }
        passesGiven30d: { type: integer }
        profilesSeen30d: { type: integer, description: Показы анкет в его ленте }
        likeRatio: { type: [number, 'null'], description: лайки / (лайки + пропуски) }
        medianSwipeMs: { type: [number, 'null'], description: Медианная пауза между реакциями }
        timesShown30d: { type: integer, description: Его показы в чужих лентах }
        likesReceived30d: { type: integer }
        inboundLikeRate: { type: [number, 'null'] }
        matches90d: { type: integer }
        dialogs90d: { type: integer }
        silentMatches90d: { type: integer, description: Мэтчи без единого сообщения }
        responseRate: { type: [number, 'null'], description: Ответил, когда написали первыми }
        ghostRate: { type: [number, 'null'], description: Так и не ответил, когда ему писали («гостит») }
        initiationRate: { type: [number, 'null'], description: Написал первым }
        medianResponseSeconds: { type: [number, 'null'] }
        messagesSent90d: { type: integer }
        avgMessageLength: { type: [number, 'null'] }
        oneWordShare: { type: [number, 'null'], description: Доля сообщений из одного слова («односложно отвечает») }
        reportsReceived: { type: integer }
        reportsMade: { type: integer }
        confirmedViolations: { type: integer }
        blockedBy: { type: integer }
        activeDays30d: { type: integer }

    RestrictionKind:
      type: string
      enum: [LIKES, MESSAGES, HIDDEN, SUSPENDED, VERIFICATION_REQUIRED]
      description: |
        LIKES — нельзя лайкать; MESSAGES — нельзя писать; HIDDEN — анкета вне ленты и вне «вас лайкнули» у всех;
        SUSPENDED — вход закрыт, при выдаче удаляются все лайки аккаунта (пропадают из «вас лайкнули» у получателей)
        и закрываются мэтчи; VERIFICATION_REQUIRED — скрыт, пока модератор не снимет.

    Restriction:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RestrictionKind' }
        reason: { type: string, description: 'Причина жалобы или код правила: LIKE_SPAM, REVIEW_HOLD, MANUAL' }
        source: { type: string, enum: [MODERATOR, RULE, ADMIN] }
        reportId: { type: [string, 'null'], format: uuid }
        createdBy: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time, description: null — до снятия }
        liftedAt: { type: [string, 'null'], format: date-time }
        liftedBy: { type: [string, 'null'], format: uuid }
        liftNote: { type: [string, 'null'] }

    SanctionStep:
      type: object
      required: [restrictions]
      properties:
        restrictions:
          type: array
          maxItems: 5
          items:
            type: object
            required: [kind]
            properties:
              kind: { $ref: '#/components/schemas/RestrictionKind' }
              hours: { type: [integer, 'null'], minimum: 1, maximum: 87600, description: null — до снятия }

    SanctionPolicy:
      type: object
      description: (n+1)-е санкционированное нарушение причины за windowDays получает steps[n]; последний шаг повторяется.
      properties:
        reason: { $ref: '#/components/schemas/ReportReason' }
        windowDays: { type: integer }
        holdOnReports: { type: [integer, 'null'], description: Скрыть анкету, пока столько разных людей держат открытые жалобы с этой причиной }
        steps: { type: array, items: { $ref: '#/components/schemas/SanctionStep' } }

    ModerationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModerationReport' } }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer }

    AdminTagFields:
      type: object
      required: [category, label, description]
      properties:
        category: { type: string, description: Существующий код категории (иначе 400 UNKNOWN_CATEGORY) }
        label: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, minLength: 1, maxLength: 255 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        active: { type: boolean, default: true }

    AdminTag:
      type: object
      properties:
        code: { type: string }
        category: { type: string }
        categoryLabel: { type: string }
        label: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
        usageCount: { type: integer, format: int64 }
        scalePosition: { type: [integer, 'null'] }

    AdminCategory:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        sortOrder: { type: integer }
        tagCount: { type: integer, format: int64 }
        scale: { type: boolean, description: Карточки упорядочены от scaleMinLabel до scaleMaxLabel }
        scaleMinLabel: { type: [string, 'null'] }
        scaleMaxLabel: { type: [string, 'null'] }

    AdminGoalFields:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        sortOrder: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        active: { type: boolean, default: true }

    AdminGoal:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
        usageCount: { type: integer, format: int64 }

    DeleteResult:
      type: object
      properties:
        result: { type: string, enum: [DELETED, DEACTIVATED], description: 'DEACTIVATED — используется, скрыто (вернуть PUT active=true)' }

    CatalogEntry:
      type: object
      properties:
        code: { type: string }
        kind: { type: string, enum: [CONSUMABLE, COSMETIC] }
        category: { type: string }
        equipSlot: { type: [string, 'null'] }
        title: { type: string }
        rarity: { type: [string, 'null'] }
        attributes: { type: object, additionalProperties: true }
        active: { type: boolean }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
        authorId: { type: [string, 'null'], format: uuid }
        authorName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCatalogItemRequest:
      type: object
      required: [code, kind, category, title]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,49}$' }
        kind: { type: string, enum: [CONSUMABLE, COSMETIC] }
        category: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,29}$' }
        equipSlot: { type: string, enum: [PHOTO_FRAME, PROFILE_STATUS, CHAT_WALLPAPER], description: 'По умолчанию слот с именем категории, если есть; у расходников и STICKER_PACK слота нет' }
